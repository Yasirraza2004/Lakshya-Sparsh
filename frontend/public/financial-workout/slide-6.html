<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slide 6 — Modern Concept</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#fff4da;
    --bg-2:#ffe3a8;
    --accent:#2f6fed;
    --accent-dark:#1e4fbb;
    --ink:#1c2333;
    --ink-soft:#5b6478;
    --wealth:#c23a3a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    background:#fff;
  }
  .hero{
    position:relative;
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.5), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255,255,255,0.35), transparent 45%),
      linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  .blob{
    position:absolute;
    border-radius:50%;
    filter: blur(2px);
    opacity:0.5;
  }
  .blob1{width:260px;height:260px; background:rgba(47,111,237,0.12); top:8%; left:6%;}
  .blob2{width:180px;height:180px; background:rgba(255,255,255,0.5); bottom:10%; right:8%;}

  .hero-inner{
    width:88%;
    max-width:1180px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:64px;
    z-index:2;
    flex-direction: row-reverse;
  }

  .content{
    flex:1;
    max-width:560px;
    text-align:left;
  }
  .headline-card{
    display:inline-block;
    padding:26px 32px;
    border-radius:20px;
    background: rgba(255,255,255,0.55);
    border:1px solid rgba(255,255,255,0.7);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 20px 45px rgba(28,35,51,0.10);
  }
  .headline-card h1{
    margin:0;
    font-size:36px;
    line-height:1.28;
    font-weight:800;
    color:var(--ink);
  }
  .headline-card .wealth{ color:var(--wealth); }
  .headline-card .accent{ color:var(--accent-dark); }

  .big-stat{
    margin-top:18px;
    font-size:44px;
    font-weight:800;
    color:var(--wealth);
    line-height:1.1;
  }
  .sub-line{
    margin-top:14px;
    font-size:18px;
    font-weight:600;
    color:var(--ink-soft);
  }

  .cta-row{
    margin-top:28px;
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
  }
  .cta-label{
    font-size:15px;
    font-weight:700;
    color:var(--ink-soft);
  }
  .cta-btn{
    padding:14px 32px;
    border-radius:12px;
    border:none;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color:#fff;
    font-family:inherit;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    box-shadow: 0 14px 30px rgba(47,111,237,0.3);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .cta-btn:hover{ transform:translateY(-2px); box-shadow:0 18px 36px rgba(47,111,237,0.4); }

  .figure-wrap{
    flex:0 0 340px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .figure-glow{
    position:absolute;
    width:320px;height:320px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,255,255,0.7), transparent 65%);
  }
  .figure-platform{
    position:absolute;
    bottom:4%;
    width:200px;
    height:26px;
    background:rgba(28,35,51,0.10);
    border-radius:50%;
    filter: blur(6px);
  }
  .figure-wrap img{
    position:relative;
    width:280px;
    max-width:100%;
    display:block;
    filter: drop-shadow(0 22px 30px rgba(28,35,51,0.16));
    animation: rise 4.5s ease-in-out infinite;
  }
  @keyframes rise{
    0%,100%{ transform: translateY(0px); }
    50%{ transform: translateY(-12px); }
  }

  .disclaimer{
    position:absolute;
    bottom:18px;
    left:0;
    right:0;
    text-align:center;
    font-size:11px;
    line-height:1.5;
    color:var(--ink-soft);
    opacity:0.75;
    padding:0 40px;
    z-index:2;
  }

  @media (max-width:900px){
    .hero-inner{ flex-direction:column-reverse; gap:24px; text-align:center; }
    .content{ text-align:center; }
    .headline-card h1{ font-size:26px; }
    .big-stat{ font-size:32px; }
    .figure-wrap{ flex-basis:auto; }
    .figure-wrap img{ width:220px; }
    .cta-row{ justify-content:center; }
    .disclaimer{ font-size:10px; }
  }
</style>
</head>
