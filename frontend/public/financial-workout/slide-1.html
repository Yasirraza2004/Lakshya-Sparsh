<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lakshya Sparsh — Slide 1 Modern Concept v2</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#fff4da;
    --bg-2:#ffe3a8;
    --accent:#2f6fed;
    --accent-dark:#1e4fbb;
    --ink:#1c2333;
    --ink-soft:#5b6478;
    --card-bg: rgba(255,255,255,0.55);
    --card-border: rgba(255,255,255,0.7);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    background:#fff;
  }
  .page{
    width:100%;
    min-height:100vh;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }

  .hero{
    position:relative;
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.5), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255,255,255,0.35), transparent 45%),
      linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
  }
  .blob{
    position:absolute;
    border-radius:50%;
    filter: blur(2px);
    opacity:0.5;
  }
  .blob1{width:260px;height:260px; background:rgba(47,111,237,0.12); top:8%; left:6%;}
  .blob2{width:180px;height:180px; background:rgba(255,255,255,0.5); bottom:10%; right:10%;}

  .hero-inner{
    width:88%;
    max-width:1180px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:64px;
    z-index:2;
  }

  .figure-wrap{
    flex:0 0 300px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .figure-platform{
    position:absolute;
    bottom:6%;
    width:200px;
    height:30px;
    background:rgba(28,35,51,0.12);
    border-radius:50%;
    filter: blur(6px);
  }
  .figure-glow{
    position:absolute;
    width:280px;height:280px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,255,255,0.7), transparent 65%);
  }
  .figure-wrap img{
    position:relative;
    width:230px;
    display:block;
    filter: drop-shadow(0 22px 30px rgba(28,35,51,0.18));
    animation: float 4.5s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{ transform: translateY(0px); }
    50%{ transform: translateY(-14px); }
  }

  .content{
    flex:1;
    max-width:560px;
    text-align:left;
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:6px 14px;
    border-radius:100px;
    background:rgba(47,111,237,0.1);
    color:var(--accent-dark);
    font-size:12px;
    font-weight:700;
    letter-spacing:0.6px;
    text-transform:uppercase;
    margin-bottom:22px;
  }
  .eyebrow-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}

  .headline-card{
    position:relative;
    display:inline-block;
    padding:26px 32px;
    border-radius:20px;
    background: var(--card-bg);
    border:1px solid var(--card-border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 20px 45px rgba(28,35,51,0.10);
    margin-bottom:22px;
  }
  .headline-card h1{
    margin:0;
    font-size:36px;
    line-height:1.28;
    font-weight:800;
    color:var(--ink);
  }
  .headline-card h1 .strike{
    position:relative;
    color:#c23a3a;
  }

  .agree-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-top:8px;
  }
  .thumb-img{
    width:46px;
    height:46px;
    object-fit:contain;
    filter: drop-shadow(0 6px 10px rgba(28,35,51,0.15));
  }
  .agree-text{
    font-size:17px;
    font-weight:600;
    color:var(--ink-soft);
  }

  .scroll-hint{
    margin-top:38px;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .scroll-pill{
    width:26px;height:40px;
    border-radius:100px;
    border:2px solid var(--ink-soft);
    display:flex;
    justify-content:center;
    padding-top:6px;
  }
  .scroll-pill span{
    width:4px;height:8px;
    border-radius:4px;
    background:var(--ink-soft);
    animation: scrolldown 1.6s ease-in-out infinite;
  }
  @keyframes scrolldown{
    0%{ opacity:1; transform:translateY(0);}
    60%{ opacity:0; transform:translateY(10px);}
    100%{opacity:0;}
  }

  .arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:46px;height:46px;
    border-radius:50%;
    background:rgba(255,255,255,0.6);
    backdrop-filter: blur(10px);
    border:1px solid rgba(255,255,255,0.8);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:20px;
    color:var(--ink);
    z-index:6;
    transition:.2s ease;
    box-shadow:0 8px 20px rgba(28,35,51,0.10);
  }
  .arrow:hover{ background:#fff; transform:translateY(-50%) scale(1.06); }
  .arrow.prev{left:28px;}
  .arrow.next{right:28px;}

  .dots{
    position:absolute;
    right:26px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:10px;
    z-index:6;
  }
  .dot{
    width:8px;height:8px;
    border-radius:50%;
    background:rgba(28,35,51,0.18);
    transition:.25s ease;
  }
  .dot.active{
    height:26px;
    border-radius:8px;
    background:var(--accent);
  }

  @media (max-width:900px){
    .hero-inner{ flex-direction:column; gap:20px; text-align:center; }
    .content{ text-align:center; }
    .headline-card h1{ font-size:26px; }
    .figure-wrap{ flex-basis:auto; }
    .figure-wrap img{ width:180px; }
    .agree-row{ justify-content:center; }
    .arrow{ width:38px;height:38px; font-size:16px; }
  }
</style>
</head>
