<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lakshya Sparsh — Slide 2 Modern Concept</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#fff4da;
    --bg-2:#ffe3a8;
    --accent:#2f6fed;
    --accent-dark:#1e4fbb;
    --ink:#1c2333;
    --ink-soft:#5b6478;
    --wealth:#c23a3a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    background:#fff;
  }
  .hero{
    position:relative;
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.5), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255,255,255,0.35), transparent 45%),
      linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  .blob{
    position:absolute;
    border-radius:50%;
    filter: blur(2px);
    opacity:0.5;
  }
  .blob1{width:260px;height:260px; background:rgba(47,111,237,0.12); top:8%; left:6%;}
  .blob2{width:180px;height:180px; background:rgba(255,255,255,0.5); bottom:10%; right:8%;}

  .hero-inner{
    width:88%;
    max-width:1180px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:64px;
    z-index:2;
  }

  .content{
    flex:1;
    max-width:520px;
    text-align:left;
  }
  .headline-card{
    display:inline-block;
    padding:26px 32px;
    border-radius:20px;
    background: rgba(255,255,255,0.55);
    border:1px solid rgba(255,255,255,0.7);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 20px 45px rgba(28,35,51,0.10);
  }
  .headline-card h1{
    margin:0;
    font-size:38px;
    line-height:1.28;
    font-weight:800;
    color:var(--ink);
  }
  .headline-card .wealth{ color:var(--wealth); }
  .headline-card .funds{ color:var(--accent-dark); }

  .figure-wrap{
    flex:0 0 420px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .figure-glow{
    position:absolute;
    width:380px;height:380px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,255,255,0.7), transparent 65%);
  }
  .figure-platform{
    position:absolute;
    bottom:4%;
    width:280px;
    height:26px;
    background:rgba(28,35,51,0.10);
    border-radius:50%;
    filter: blur(6px);
  }
  .figure-wrap img{
    position:relative;
    width:380px;
    display:block;
    filter: drop-shadow(0 22px 30px rgba(28,35,51,0.16));
    animation: rise 4.5s ease-in-out infinite;
  }
  @keyframes rise{
    0%,100%{ transform: translateY(0px); }
    50%{ transform: translateY(-12px); }
  }

  @media (max-width:900px){
    .hero-inner{ flex-direction:column-reverse; gap:24px; text-align:center; }
    .content{ text-align:center; }
    .headline-card h1{ font-size:26px; }
    .figure-wrap{ flex-basis:auto; }
    .figure-wrap img{ width:260px; }
  }
</style>
</head>
<body>
  <section class="hero">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>

    <div class="hero-inner">
      <div class="content">

      </div>
